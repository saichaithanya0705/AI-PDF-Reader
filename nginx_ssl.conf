
server {
    listen 80;
    server_name 64-227-179-63.sslip.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 64-227-179-63.sslip.io;

    ssl_certificate /etc/letsencrypt/live/64-227-179-63.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/64-227-179-63.sslip.io/privkey.pem;

    # SSL Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Upload Limit
    client_max_body_size 100M;

    # Frontend Static Files
    location / {
        root /var/www/pdfapp/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Backend API Proxy
    location /api {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # WebSocket Proxy (if needed distinct from /api)
    location /ws {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Uploads Proxy
    location /upload {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Increase body size for uploads
        client_max_body_size 100M;
    }
}
